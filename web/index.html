<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#172238">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" href="icons/favicon-48.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="BCRA">
  <title>Entrar — Controle de Produção</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Manrope:wght@700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="v2 login-v2">
  <div class="login-wrap">
    <div class="card login-card">
      <div class="marca">
        <svg class="logo-bcra grande" viewBox="0 0 120 120" role="img" aria-label="BCRA Mão de Obra"><circle cx="60" cy="60" r="60" fill="#172238"/><path d="M43 43 C 20 62, 24 94, 50 90 C 72 87, 76 68, 96 80" fill="none" stroke="#f5c518" stroke-width="5" stroke-linecap="round"/><g transform="rotate(-45 60 60)"><path d="M56 26 A4 4 0 0 1 64 26 L64 90 L60 106 L56 90 Z" fill="#fff"/><rect x="58.4" y="29" width="3.2" height="13" rx="1.6" fill="#172238"/></g></svg>
        <div class="marca-nome">BCRA</div>
        <div class="marca-sub"><i></i>MÃO DE OBRA</div>
        <h1 id="nomeFabrica" class="hidden">Controle de Produção</h1>
        <div class="muted small">Entre com o usuário e a senha que você recebeu</div>
      </div>
      <form id="formLogin">
        <div style="margin-bottom:.7rem">
          <label for="usuario">Usuário</label>
          <input id="usuario" name="usuario" autocomplete="username" autocapitalize="none" required>
        </div>
        <div style="margin-bottom:1rem">
          <label for="senha">Senha</label>
          <input id="senha" name="senha" type="password" autocomplete="current-password" required>
        </div>
        <button class="btn bloco" type="submit">Entrar</button>
        <p id="erro" class="small" style="color:var(--bad);min-height:1.2em;margin:.6rem 0 0"></p>
      </form>
      <p class="muted small" style="text-align:center;margin:.4rem 0 0">Esqueceu a senha? Peça ao dono para redefinir.</p>
      <div id="areaInstalar" style="margin-top:1rem"></div>
    </div>
  </div>
  <script type="module">
    import { entrar, carregarPerfil, botaoInstalar } from "./js/comum.js";
    botaoInstalar(document.getElementById("areaInstalar"));
    import { NOME_FABRICA } from "./config.js";
    document.getElementById("nomeFabrica").textContent = NOME_FABRICA;

    const ir = (p) => location.replace(p.papel === "dono" ? "dono.html" : p.papel === "motorista" ? "motorista.html" : "producao.html");
    carregarPerfil().then((p) => p && ir(p)).catch(() => {});

    document.getElementById("formLogin").addEventListener("submit", async (e) => {
      e.preventDefault();
      const erro = document.getElementById("erro");
      const botao = e.target.querySelector("button");
      erro.textContent = ""; botao.disabled = true;
      try {
        const perfil = await entrar(e.target.usuario.value, e.target.senha.value);
        if (!perfil) throw new Error("Este login não tem cadastro na fábrica.");
        ir(perfil);
      } catch (err) { erro.textContent = err.message; }
      finally { botao.disabled = false; }
    });
  </script>
</body>
</html>
