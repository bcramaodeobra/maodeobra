<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#23324d">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" href="icons/favicon-48.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="BCRA">
  <title>Entrar — Controle de Produção</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="login-wrap">
    <div class="card login-card">
      <div class="marca">
        <div class="ponto">🧵</div>
        <h1 id="nomeFabrica">Controle de Produção</h1>
        <div class="muted small">Entre com o usuário e a senha que você recebeu</div>
      </div>
      <form id="formLogin">
        <div style="margin-bottom:.7rem">
          <label for="usuario">Usuário</label>
          <input id="usuario" name="usuario" autocomplete="username" autocapitalize="none" required>
        </div>
        <div style="margin-bottom:1rem">
          <label for="senha">Senha</label>
          <input id="senha" name="senha" type="password" autocomplete="current-password" required>
        </div>
        <button class="btn bloco" type="submit">Entrar</button>
        <p id="erro" class="small" style="color:var(--bad);min-height:1.2em;margin:.6rem 0 0"></p>
      </form>
      <p class="muted small" style="text-align:center;margin:.4rem 0 0">Esqueceu a senha? Peça ao dono para redefinir.</p>
      <div id="areaInstalar" style="margin-top:1rem"></div>
    </div>
  </div>
  <script type="module">
    import { entrar, carregarPerfil, botaoInstalar } from "./js/comum.js";
    botaoInstalar(document.getElementById("areaInstalar"));
    import { NOME_FABRICA } from "./config.js";
    document.getElementById("nomeFabrica").textContent = NOME_FABRICA;

    const ir = (p) => location.replace(p.papel === "dono" ? "dono.html" : "producao.html");
    carregarPerfil().then((p) => p && ir(p)).catch(() => {});

    document.getElementById("formLogin").addEventListener("submit", async (e) => {
      e.preventDefault();
      const erro = document.getElementById("erro");
      const botao = e.target.querySelector("button");
      erro.textContent = ""; botao.disabled = true;
      try {
        const perfil = await entrar(e.target.usuario.value, e.target.senha.value);
        if (!perfil) throw new Error("Este login não tem cadastro na fábrica.");
        ir(perfil);
      } catch (err) { erro.textContent = err.message; }
      finally { botao.disabled = false; }
    });
  </script>
</body>
</html>
