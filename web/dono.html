<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#172238">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" href="icons/favicon-48.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="BCRA">
  <title>Painel do Dono — Controle de Produção</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Manrope:wght@700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="dono v2">
  <div class="app">
    <!-- Menu lateral (computador) -->
    <aside class="sidebar" aria-label="Menu principal">
      <div class="sb-marca">
        <svg class="logo-bcra" viewBox="0 0 120 120" aria-hidden="true"><circle cx="60" cy="60" r="60" fill="#23324d"/><path d="M43 43 C 20 62, 24 94, 50 90 C 72 87, 76 68, 96 80" fill="none" stroke="#f5c518" stroke-width="5" stroke-linecap="round"/><g transform="rotate(-45 60 60)"><path d="M56 26 A4 4 0 0 1 64 26 L64 90 L60 106 L56 90 Z" fill="#fff"/><rect x="58.4" y="29" width="3.2" height="13" rx="1.6" fill="#23324d"/></g></svg>
        <div><div class="sb-nome" id="sbNome">BCRA</div><div class="sb-sub">Gestão de mão de obra</div></div>
      </div>
      <nav id="abas">
        <div class="sb-grupo">OPERAÇÃO</div>
        <button data-aba="inicio" class="ativo"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>Início</button>
        <button data-aba="minha"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21 8 12 3 3 8v8l9 5 9-5z"/><path d="M3 8l9 5 9-5M12 13v8"/></svg>Minha mão de obra</button>
        <button data-aba="fechamentos"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="2" y="6" width="20" height="13" rx="2"/><path d="M2 10h20M6 15h4"/></svg>Fechamentos</button>
        <button data-aba="folha"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5M9 13h6M9 17h4"/></svg>Folha de pagamento</button>
        <button data-aba="relatorios"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>Relatórios</button>
        <div class="sb-grupo">CADASTROS</div>
        <button data-aba="maos"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="9" cy="8" r="4"/><path d="M2 21c0-4 3-6 7-6s7 2 7 6M17 4a4 4 0 0 1 0 8M22 21c0-3-2-5-4-5.5"/></svg>Pessoas</button>
        <button data-aba="servicos"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="6" cy="6" r="3"/><circle cx="6" cy="18" r="3"/><path d="M20 4 8.1 15.9M14.5 14.5 20 20M8.1 8.1 12 12"/></svg>Produtos e serviços</button>
        <button data-aba="equipamentos"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14.7 6.3a4 4 0 0 0-5.4 5.4L3 18l3 3 6.3-6.3a4 4 0 0 0 5.4-5.4l-2.5 2.5-2.4-.6-.6-2.4z"/></svg>Equipamentos</button>
        <div class="sb-grupo">GESTÃO</div>
        <button data-aba="gastos"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 3h16v18l-3-2-3 2-2-2-2 2-3-2-3 2z"/><path d="M8 8h8M8 12h8M8 16h5"/></svg>Gastos do mês</button>
        <button data-aba="admin"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 21v-7M4 10V3M12 21v-9M12 8V3M20 21v-5M20 12V3M1 14h6M9 8h6M17 16h6"/></svg>Administrativo</button>
      </nav>
      <div class="sb-usuario">
        <div class="sb-avatar" id="sbAvatar">B</div>
        <div class="sb-quem"><div id="quem"></div><span>Administrador</span></div>
        <button class="sb-icone" id="btnSenha" title="Minha conta" aria-label="Minha conta"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="8" cy="15" r="4"/><path d="m10.8 12.2 9.2-9.2M17 6l3 3M15 8l2 2"/></svg></button>
        <button class="sb-icone" id="btnSair" title="Sair" aria-label="Sair"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/></svg></button>
      </div>
    </aside>

    <div class="area">
      <!-- Topo no celular -->
      <header class="topo-celular">
        <svg class="logo-bcra pequeno" viewBox="0 0 120 120" aria-hidden="true"><circle cx="60" cy="60" r="60" fill="#23324d"/><path d="M43 43 C 20 62, 24 94, 50 90 C 72 87, 76 68, 96 80" fill="none" stroke="#f5c518" stroke-width="5" stroke-linecap="round"/><g transform="rotate(-45 60 60)"><path d="M56 26 A4 4 0 0 1 64 26 L64 90 L60 106 L56 90 Z" fill="#fff"/><rect x="58.4" y="29" width="3.2" height="13" rx="1.6" fill="#23324d"/></g></svg>
        <div class="tc-texto"><strong id="tcOla">Olá</strong><span id="tcData"></span></div>
        <button class="tc-sino" id="tcSino" aria-label="Avisos"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9M10.3 21a1.9 1.9 0 0 0 3.4 0"/></svg><i id="tcPonto" class="hidden"></i></button>
      </header>

      <main id="conteudo"><div class="vazio">Carregando…</div></main>
    </div>
  </div>

  <!-- Só aparece no celular -->
  <button class="fab" id="fabLote" type="button">＋ Enviar lote</button>
  <nav class="nav-baixo" id="navBaixo">
    <button data-aba="inicio" class="ativo"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg><span>Início</span></button>
    <button data-aba="minha"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21 8 12 3 3 8v8l9 5 9-5z"/><path d="M3 8l9 5 9-5M12 13v8"/></svg><span>Minha MO</span></button>
    <button data-aba="fechamentos"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="2" y="6" width="20" height="13" rx="2"/><path d="M2 10h20M6 15h4"/></svg><span>Fechamentos</span></button>
    <button data-mais><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"/></svg><span>Mais</span></button>
  </nav>

  <script type="module" src="js/dono.js"></script>
</body>
</html>
