<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#23324d">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" href="icons/favicon-48.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="BCRA">
  <title>Painel do Dono — Controle de Produção</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="dono">
  <header class="nav-dono">
    <div class="marca-celular">🧵 Painel do Dono</div>
    <nav class="abas" id="abas">
      <button data-aba="inicio" class="ativo">Início</button>
      <button data-aba="minha">Minha mão de obra</button>
      <button data-aba="maos">Cadastros mão de obra</button>
      <button data-aba="servicos">Cadastros serviços</button>
      <button data-aba="fechamentos">Fechamentos</button>
      <button data-aba="admin">Administrativo</button>
    </nav>
    <div class="usuario">
      <span id="quem"></span>
      <button class="icon-btn" id="btnSenha" title="Trocar senha">🔑</button>
      <button class="icon-btn" id="btnSair" title="Sair">⏻</button>
    </div>
  </header>

  <main id="conteudo"><div class="vazio">Carregando…</div></main>

  <!-- Só aparece no celular -->
  <button class="fab" id="fabLote" type="button">＋ Enviar lote</button>
  <nav class="nav-baixo" id="navBaixo">
    <button data-aba="inicio" class="ativo"><i>🏠</i><span>Início</span></button>
    <button data-aba="minha"><i>📦</i><span>Minha MO</span></button>
    <button data-aba="fechamentos"><i>💰</i><span>Fechamentos</span></button>
    <button data-mais><i>☰</i><span>Mais</span></button>
  </nav>

  <script type="module" src="js/dono.js"></script>
</body>
</html>
