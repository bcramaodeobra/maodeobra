<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#23324d">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" href="icons/favicon-48.png">

<body class="dono">
  <header class="nav-dono">
    <nav class="abas" id="abas">
      <button data-aba="inicio" class="ativo">Início</button>
      <button data-aba="minha">Minha mão de obra</button>
      <button data-aba="maos">Cadastros mão de obra</button>
      <button data-aba="servicos">Cadastros serviços</button>
      <button data-aba="fechamentos">Fechamentos</button>
      <button data-aba="admin">Administrativo</button>
    </nav>
    <div class="usuario">
      <span id="quem"></span>
      <button class="icon-btn" id="btnSenha" title="Trocar senha">🔑</button>
      <button class="icon-btn" id="btnSair" title="Sair">⏻</button>
    </div>
  </header>

  <main id="conteudo"><div class="vazio">Carregando…</div></main>

  <script type="module" src="js/dono.js"></script>
